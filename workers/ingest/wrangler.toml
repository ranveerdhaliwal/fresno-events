name = "fresno-events-ingest"
main = "src/index.ts"
compatibility_date = "2026-04-24"
account_id = "b8c559487d24af4a208be0a5584512a9"

# Top-level config = the implicit "local" profile used by `wrangler dev` /
# `wrangler deploy` without --env. Per-env overrides live below.
# No top-level cron — local runs use `wrangler dev --test-scheduled` manually.

[vars]
APP_ENV = "local"
USER_AGENT = "WhatUpFresnoBot/0.1 (contact: admin@whatupfresno.com)"
# Per-run budget caps. Override in production via wrangler vars or .dev.vars.
MAX_SOURCES_PER_RUN = "12"
MAX_ENRICH_PER_RUN = "50"
MAX_PAGES_PER_SEED = "30"
MAX_CRAWL_DEPTH = "3"

[ai]
binding = "AI"
remote = true

[observability]
enabled = true
head_sampling_rate = 1

# --- Cloud dev profile -----------------------------------------------------
# Use with: `wrangler dev --env dev` (loads workers/ingest/.dev.vars.dev) or
# `wrangler deploy --env dev` to ship the dev-suffixed Worker.
[env.dev]
name = "fresno-events-ingest-dev"

# Cloud cron DISABLED — Workers free tier cannot run full ingest reliably.
# Local schedule: pnpm ingest:scheduled-local (see docs/INGEST_LOCAL_OPS.md).
# Re-enable on paid Workers: uncomment crons below and deploy.
[env.dev.triggers]
crons = []
# crons = [
#   "0 14 * * 1",  # Monday ~6am PT (7am PDT) — wrangler uses UTC only
#   "0 14 * * 4"   # Thursday ~6am PT
# ]

[env.dev.vars]
APP_ENV = "dev"
USER_AGENT = "WhatUpFresnoBot/0.1 (contact: admin@whatupfresno.com)"
MAX_SOURCES_PER_RUN = "12"
MAX_ENRICH_PER_RUN = "50"
MAX_PAGES_PER_SEED = "30"
MAX_CRAWL_DEPTH = "3"

[env.dev.ai]
binding = "AI"
remote = true

[env.dev.observability]
enabled = true
head_sampling_rate = 1

# --- Production profile ---------------------------------------------------
# Do not deploy prod ingest for now — scraping runs on dev/local only.
# Prod events are promoted manually later (see README roadmap).
# No [env.prod.triggers]: prod must not auto-scrape.
[env.prod]
name = "fresno-events-ingest"

[env.prod.limits]
cpu_ms = 300_000

[env.prod.vars]
APP_ENV = "production"
USER_AGENT = "WhatUpFresnoBot/0.1 (contact: admin@whatupfresno.com)"
MAX_SOURCES_PER_RUN = "12"
MAX_ENRICH_PER_RUN = "50"
MAX_PAGES_PER_SEED = "30"
MAX_CRAWL_DEPTH = "3"

[env.prod.ai]
binding = "AI"
remote = true

[env.prod.observability]
enabled = true
head_sampling_rate = 1
