name = "fresno-events-api"
main = "src/index.ts"
compatibility_date = "2026-04-24"
account_id = "b8c559487d24af4a208be0a5584512a9"

# Top-level = the implicit "local" profile (used by `wrangler dev` /
# `wrangler deploy` without --env). Per-env overrides live below.

[vars]
APP_ENV = "local"
ALLOWED_ORIGIN = "http://localhost:5182"

[observability]
enabled = true
head_sampling_rate = 1

# --- Cloud dev profile -----------------------------------------------------
# `wrangler deploy --env dev` ships fresno-events-api-dev (live site API for v1).
# `wrangler dev --env dev` loads apps/api/.dev.vars.dev for local iteration
# pointed at the cloud dev Supabase project.
[env.dev]
name = "fresno-events-api-dev"

[env.dev.vars]
APP_ENV = "dev"
ALLOWED_ORIGINS = "http://localhost:5182,https://whatupfresno.com,https://www.whatupfresno.com"

[env.dev.observability]
enabled = true
head_sampling_rate = 1

[[env.dev.routes]]
pattern = "api.whatupfresno.com"
custom_domain = true

# --- Production profile ---------------------------------------------------
# `wrangler deploy --env prod` ships the prod API Worker.
[env.prod]
name = "fresno-events-api"

[env.prod.vars]
APP_ENV = "production"
ALLOWED_ORIGINS = "https://whatupfresno.com,https://www.whatupfresno.com"

[env.prod.observability]
enabled = true
head_sampling_rate = 1
