project_id = "what-up-fresno"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
# Match cloud dev (what-up-fresno-dev). After changing: supabase stop && supabase start
# If Postgres fails to start on an existing volume, run: pnpm db:reset (wipes local data).
major_version = 17

[studio]
enabled = true
# 54323 is often blocked on WSL/Windows (excluded port range); use 54423 if Studio won't load.
port = 54423

[inbucket]
enabled = true
port = 54324

[auth]
enabled = true
site_url = "http://localhost:5182"
additional_redirect_urls = ["http://localhost:5182"]
enable_signup = true
